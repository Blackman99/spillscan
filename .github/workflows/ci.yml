name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - run: go build -o spillscan ./cmd/spillscan
      - name: smoke scan fixtures
        shell: bash
        run: |
          ./spillscan scan testdata >/tmp/out.txt || code=$?
          echo "exit=${code:-0}"
          test "${code:-0}" = "2"
          ./spillscan paths || true
          ./spillscan version
